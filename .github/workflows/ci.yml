name: CI / Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests (Node.js & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB with Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" --quiet; do
            sleep 1
          done
          docker exec mongodb mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          docker exec mongodb mongosh --eval "rs.status().ok"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend test suite
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/securebypay_test?replicaSet=rs0&directConnection=true
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/securebypay_test?replicaSet=rs0&directConnection=true
        run: |
          export JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          npm test

  frontend-tests:
    name: Frontend Tests & Lint (Flutter Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter unit & widget tests
        working-directory: frontend
        run: flutter test

  build-verification:
    name: Production Build Verification
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build Flutter Web bundle
        run: |
          cd frontend
          flutter pub get
          flutter build web --release --dart-define=API_URL=/api

      - name: Build TypeScript Backend
        run: |
          cd backend
          npm ci
          npm run build
